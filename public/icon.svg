<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f234a" />
      <stop offset="65%" stop-color="#07122a" />
      <stop offset="100%" stop-color="#030916" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="pitchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer Stadium Floodlight Ring -->
  <circle cx="256" cy="256" r="206" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="6" />
  <circle cx="256" cy="256" r="176" fill="url(#pitchGrad)" stroke="#4ade80" stroke-opacity="0.6" stroke-width="4" />

  <!-- Pitch Strip -->
  <rect x="220" y="120" width="72" height="272" rx="14" fill="#d6b47c" opacity="0.92" />

  <!-- Stumps -->
  <g fill="#fef3c7" stroke="#b45309" stroke-width="2">
    <rect x="234" y="184" width="8" height="148" rx="3" />
    <rect x="252" y="180" width="8" height="152" rx="3" />
    <rect x="270" y="184" width="8" height="148" rx="3" />
    <!-- Bails -->
    <rect x="233" y="176" width="21" height="7" rx="3" fill="url(#goldGrad)" />
    <rect x="258" y="176" width="21" height="7" rx="3" fill="url(#goldGrad)" />
  </g>

  <!-- Angled Cricket Bat -->
  <g transform="translate(256 266) rotate(-34)">
    <rect x="-18" y="-110" width="36" height="146" rx="10" fill="url(#goldGrad)" stroke="#78350f" stroke-width="4" />
    <rect x="-7" y="-168" width="14" height="62" rx="5" fill="#1e293b" stroke="#fbbf24" stroke-width="3" />
  </g>

  <!-- Crimson Cricket Ball with Seam -->
  <g transform="translate(324 196)">
    <circle cx="0" cy="0" r="34" fill="#dc2626" stroke="#fecaca" stroke-width="3" />
    <path d="M -22 -18 Q 0 0 22 18" fill="none" stroke="#fef2f2" stroke-width="3" stroke-dasharray="5,4" />
    <circle cx="-10" cy="-12" r="8" fill="#fca5a5" opacity="0.45" />
  </g>

  <!-- Bottom Max Badge -->
  <rect x="136" y="378" width="240" height="48" rx="14" fill="#040b1c" stroke="#fbbf24" stroke-width="3" />
  <text x="256" y="410" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="26" letter-spacing="4" fill="#fbbf24">
    CRICKET MAX
  </text>
</svg>
